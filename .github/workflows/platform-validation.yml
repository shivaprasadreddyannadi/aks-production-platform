name: Platform Validation

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "helm/**"
      - ".github/workflows/platform-validation.yml"

  pull_request:
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "helm/**"
      - ".github/workflows/platform-validation.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../../

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  kubernetes:
    name: Kubernetes Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Render Kustomize manifests
        run: |
          kubectl kustomize kubernetes/base \
            > /tmp/kubernetes-rendered.yaml

      - name: Verify rendered manifests
        run: |
          test -s /tmp/kubernetes-rendered.yaml
          grep -q "kind: Deployment" /tmp/kubernetes-rendered.yaml
          grep -q "kind: Service" /tmp/kubernetes-rendered.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/kubernetes-rendered.yaml
          grep -q "kind: PodDisruptionBudget" /tmp/kubernetes-rendered.yaml
          grep -q "kind: NetworkPolicy" /tmp/kubernetes-rendered.yaml

  helm:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.18.4"

      - name: Lint default Helm values
        run: helm lint helm/platform-app

      - name: Lint development Helm values
        run: |
          helm lint helm/platform-app \
            --values helm/platform-app/values-dev.yaml

      - name: Render Helm templates
        run: |
          helm template platform-dev helm/platform-app \
            --namespace platform-app \
            --values helm/platform-app/values-dev.yaml \
            > /tmp/helm-rendered.yaml

      - name: Verify rendered Helm resources
        run: |
          test -s /tmp/helm-rendered.yaml
          grep -q "kind: Deployment" /tmp/helm-rendered.yaml
          grep -q "kind: Service" /tmp/helm-rendered.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/helm-rendered.yaml