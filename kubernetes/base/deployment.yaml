apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-app
  namespace: platform-app
  labels:
    app.kubernetes.io/name: platform-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: platform-app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-app

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: platform-app
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 8080

          command:
            - /bin/sh
            - -c

          args:
            - |
              sed -i 's/listen       80;/listen       8080;/' /etc/nginx/conf.d/default.conf
              nginx -g 'daemon off;'

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20