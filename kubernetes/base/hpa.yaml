apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-app
  namespace: platform-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-app

  minReplicas: 2
  maxReplicas: 6

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70